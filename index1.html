<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Full Circle Media — Logo Animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=Work+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --gap-deg: 40deg;
  }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#000; overflow:hidden;
    font-family: 'Oswald', sans-serif;
  }
  .stage{
    position:relative; width:100vw; height:100vh;
    background:#000;
    display:flex; align-items:center; justify-content:center;
    cursor:default;
  }

  /* the "frame" is everything that weaves/flickers like projected film */
  .frame{
    position:relative;
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    will-change:transform, filter;
  }

  .countdown-wrap{
    position:relative;
    width:min(34vh, 62vw); height:min(34vh, 62vw);
    display:flex; align-items:center; justify-content:center;
    opacity:1;
  }
  .ring{
    position:absolute; top:0; left:0; width:100%; height:100%;
    transform:rotate(-90deg);
  }
  .ring-track{
    fill:none;
    stroke:rgba(255,255,255,0.10);
    stroke-width:1.4;
  }
  .ring-progress{
    fill:none;
    stroke:rgba(237,229,210,0.92);
    stroke-width:2;
    stroke-linecap:round;
    filter: drop-shadow(0 0 1.5px rgba(255,255,255,0.35));
  }
  .digit{
    font-family:'Oswald', sans-serif;
    font-weight:400;
    font-size:min(11vh, 20vw);
    color:rgba(240,232,213,0.94);
    letter-spacing:2px;
    line-height:1;
    user-select:none;
    text-shadow: 0 0 8px rgba(255,255,255,0.08);
  }

  .logo-text{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    opacity:0;
    pointer-events:none;
    width:100%;
    display:flex;
    justify-content:center;
    padding:0 4vw;
    box-sizing:border-box;
  }
  .logo-text span{
    font-family:'Aptos', 'Work Sans', 'Segoe UI', sans-serif;
    font-weight:300;
    font-size:min(5vh, 8vw, 52px);
    letter-spacing:0.30em;
    color:rgba(239,230,209,0.95);
    padding-right:0.30em; /* compensate trailing letter-spacing so it optically centers */
    white-space:nowrap;
    text-shadow: 0 0 10px rgba(255,255,255,0.10);
  }

  /* vignette */
  .vignette{
    position:absolute; inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 78%, rgba(0,0,0,0.92) 100%);
    z-index:5;
  }

  /* grain canvas */
  canvas#grain{
    position:absolute; inset:0; width:100%; height:100%;
    mix-blend-mode:overlay;
    opacity:0.55;
    pointer-events:none;
    z-index:6;
  }

  /* scratches */
  canvas#scratches{
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none;
    opacity:0.5;
    mix-blend-mode:screen;
    z-index:7;
  }

  #finalFade{
    position:absolute; inset:0;
    background:#000;
    opacity:0;
    pointer-events:none;
    z-index:12;
  }

  #startBtn{
    position:absolute; z-index:20;
    bottom:6vh; left:50%; transform:translateX(-50%);
    background:transparent;
    border:1px solid rgba(255,255,255,0.35);
    color:rgba(240,240,235,0.85);
    font-family:'Oswald', sans-serif;
    font-weight:400;
    letter-spacing:0.3em;
    text-transform:lowercase;
    font-size:13px;
    padding:12px 26px;
    cursor:pointer;
    transition:all 0.3s ease;
  }
  #startBtn:hover{
    background:rgba(255,255,255,0.08);
    border-color:rgba(255,255,255,0.6);
  }
  #startBtn.hidden{
    opacity:0; pointer-events:none;
  }
  #soundNote{
    position:absolute; z-index:20; bottom:2.2vh; left:50%; transform:translateX(-50%);
    color:rgba(255,255,255,0.3); font-size:10px; letter-spacing:0.15em;
    font-family:'Oswald', sans-serif; text-transform:lowercase;
  }
  #soundNote.hidden{ opacity:0; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="frame" id="frame">
    <div class="countdown-wrap" id="countdownWrap">
      <svg class="ring" viewBox="0 0 200 200">
        <circle class="ring-track" cx="100" cy="100" r="90"></circle>
        <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="90"
                stroke-dasharray="565.48" stroke-dashoffset="565.48"></circle>
      </svg>
      <div class="digit" id="digit">8</div>
    </div>
    <div class="logo-text" id="logoText"><span>full circle media</span></div>
  </div>
  <div class="vignette"></div>
  <canvas id="grain"></canvas>
  <canvas id="scratches"></canvas>
  <div id="finalFade"></div>
  <button id="startBtn">begin</button>
  <div id="soundNote">for the full effect, use sound</div>
</div>

<script>
(function(){
  const stage = document.getElementById('stage');
  const frame = document.getElementById('frame');
  const digitEl = document.getElementById('digit');
  const ring = document.getElementById('ringProgress');
  const countdownWrap = document.getElementById('countdownWrap');
  const logoText = document.getElementById('logoText');
  const startBtn = document.getElementById('startBtn');
  const soundNote = document.getElementById('soundNote');
  const grainCanvas = document.getElementById('grain');
  const scratchCanvas = document.getElementById('scratches');
  const finalFade = document.getElementById('finalFade');
  const gctx = grainCanvas.getContext('2d');
  const sctx = scratchCanvas.getContext('2d');

  const CIRC = 2 * Math.PI * 90;
  ring.setAttribute('stroke-dasharray', CIRC.toFixed(2));
  ring.setAttribute('stroke-dashoffset', CIRC.toFixed(2));

  function resize(){
    [grainCanvas, scratchCanvas].forEach(c=>{
      c.width = stage.clientWidth;
      c.height = stage.clientHeight;
    });
    fitLogoText();
  }

  // ---------- Guaranteed-fit logo text ----------
  const logoSpan = logoText.querySelector('span');
  function fitLogoText(){
    logoSpan.style.fontSize = ''; // reset to CSS baseline before measuring
    const maxWidth = stage.clientWidth * 0.86;
    const naturalWidth = logoSpan.scrollWidth;
    if(naturalWidth > maxWidth){
      const cssSize = parseFloat(getComputedStyle(logoSpan).fontSize);
      const scale = maxWidth / naturalWidth;
      logoSpan.style.fontSize = (cssSize * scale).toFixed(2) + 'px';
    }
  }
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(fitLogoText);
  }
  window.addEventListener('orientationchange', fitLogoText);
  resize();
  window.addEventListener('resize', resize);

  // ---------- Grain ----------
  function drawGrain(intensity){
    const w = grainCanvas.width, h = grainCanvas.height;
    const imgData = gctx.createImageData(w, h);
    const buf = imgData.data;
    // sparse noise for performance: fill in blocks
    for(let i=0;i<buf.length;i+=4){
      const v = (Math.random()*255*intensity)|0;
      buf[i] = v; buf[i+1]=v; buf[i+2]=v; buf[i+3]= Math.random()*40*intensity;
    }
    gctx.putImageData(imgData,0,0);
  }

  // ---------- Scratches & dust ----------
  let scratchState = [];
  function updateScratches(intensity){
    sctx.clearRect(0,0,scratchCanvas.width, scratchCanvas.height);
    if(Math.random() < 0.35 * intensity){
      const w = scratchCanvas.width, h = scratchCanvas.height;
      const x = Math.random()*w;
      sctx.strokeStyle = `rgba(255,255,255,${0.08 + Math.random()*0.18*intensity})`;
      sctx.lineWidth = 0.6 + Math.random()*1.2;
      sctx.beginPath();
      sctx.moveTo(x + (Math.random()-0.5)*20, 0);
      sctx.lineTo(x + (Math.random()-0.5)*20, h);
      sctx.stroke();
    }
    // dust specks
    const specks = Math.floor(Math.random()*6*intensity);
    for(let i=0;i<specks;i++){
      sctx.fillStyle = `rgba(255,255,255,${0.15+Math.random()*0.3})`;
      const r = Math.random()*1.6+0.3;
      sctx.beginPath();
      sctx.arc(Math.random()*scratchCanvas.width, Math.random()*scratchCanvas.height, r, 0, Math.PI*2);
      sctx.fill();
    }
  }

  // ---------- Audio (synthesized, no external samples) ----------
  let audioCtx, master, humGain, humFilter, humSource, flutterLFO;
  function initAudio(){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    master = audioCtx.createGain();
    master.gain.value = 0.0;
    master.connect(audioCtx.destination);

    // brown-ish noise buffer for projector hum
    const bufSize = audioCtx.sampleRate * 2;
    const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    let last = 0;
    for(let i=0;i<bufSize;i++){
      const white = Math.random()*2-1;
      last = (last + 0.02*white) / 1.02;
      data[i] = last * 3.2;
    }
    humSource = audioCtx.createBufferSource();
    humSource.buffer = buffer;
    humSource.loop = true;

    humFilter = audioCtx.createBiquadFilter();
    humFilter.type = 'bandpass';
    humFilter.frequency.value = 140;
    humFilter.Q.value = 0.7;

    humGain = audioCtx.createGain();
    humGain.gain.value = 0.0;

    // flutter: subtle amplitude modulation
    flutterLFO = audioCtx.createOscillator();
    flutterLFO.frequency.value = 5.5;
    const flutterDepth = audioCtx.createGain();
    flutterDepth.gain.value = 0.04;
    flutterLFO.connect(flutterDepth);
    flutterDepth.connect(humGain.gain);

    humSource.connect(humFilter);
    humFilter.connect(humGain);
    humGain.connect(master);

    humSource.start();
    flutterLFO.start();
  }

  function click(time, hardness){
    const dur = 0.045;
    const bufSize = Math.floor(audioCtx.sampleRate*dur);
    const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufSize;i++){
      data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufSize, 3);
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 900 + hardness*400;
    bp.Q.value = 1.2;
    const g = audioCtx.createGain();
    g.gain.value = 0.35;
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(time);
  }

  function breathResolve(time){
    // a quiet, warm swell — not a hit
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(120, time);
    osc.frequency.linearRampToValueAtTime(96, time+1.4);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0, time);
    g.gain.linearRampToValueAtTime(0.09, time+0.5);
    g.gain.linearRampToValueAtTime(0.0, time+1.6);
    osc.connect(g); g.connect(master);
    osc.start(time);
    osc.stop(time+1.7);
  }

  // ---------- Animation timeline ----------
  const COUNT_START = 8;
  const STEP_MS = 780;              // duration each number is on screen
  const TOTAL_COUNT_MS = COUNT_START * STEP_MS; // continuous progress span
  const PRE_SILENCE_MS = 650;
  const POST_COUNT_PAUSE_MS = 550;
  const SETTLE_MS = 900;
  const TEXT_FADE_DELAY_MS = 1000;  // a full second of black silence before it emerges
  const TEXT_FADE_MS = 1900;        // darkroom-style emergence, ~1.5-2s
  const FINAL_HOLD_MS = 2600;       // hold on the fully-resolved logo
  const FINAL_FADE_MS = 1800;       // fade the whole frame to black

  let startTime = null;
  let lastGrainDraw = 0;
  let clicksScheduled = false;
  let audioFadeScheduled = false;

  function easeInOutCubic(t){
    return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
  }

  function frameLoop(ts){
    if(startTime===null) startTime = ts;
    const t = ts - startTime;

    // --- Phase timings ---
    const countdownStart = PRE_SILENCE_MS;
    const countdownEnd = countdownStart + TOTAL_COUNT_MS;
    const resolveAt = countdownEnd + POST_COUNT_PAUSE_MS;
    const settleEnd = resolveAt + SETTLE_MS;
    const textStart = settleEnd + TEXT_FADE_DELAY_MS;
    const textEnd = textStart + TEXT_FADE_MS;
    const finalFadeStart = textEnd + FINAL_HOLD_MS;
    const finalFadeEnd = finalFadeStart + FINAL_FADE_MS;

    // --- intensity of "projected film" artifacts (weave/flicker/grain/scratches) ---
    let artifactIntensity;
    if(t < countdownEnd){
      artifactIntensity = 1.0;
    } else if(t < settleEnd){
      const p = (t-countdownEnd) / (settleEnd-countdownEnd);
      artifactIntensity = 1.0 - easeInOutCubic(Math.min(p,1));
    } else {
      artifactIntensity = 0.12; // subtle residual grain forever
    }

    // frame weave (subtle random translate) + flicker (brightness)
    const weaveAmt = 1.6 * artifactIntensity;
    const dx = (Math.random()-0.5) * weaveAmt;
    const dy = (Math.random()-0.5) * weaveAmt;
    const flicker = 1 + (Math.random()-0.5) * 0.05 * artifactIntensity;
    frame.style.transform = `translate(${dx}px, ${dy}px)`;
    frame.style.filter = `brightness(${flicker})`;

    // grain + scratches
    if(ts - lastGrainDraw > 33){ // ~30fps for grain, cheaper
      drawGrain(0.35 + 0.65*artifactIntensity);
      updateScratches(artifactIntensity);
      lastGrainDraw = ts;
    }

    // --- Countdown ring + digit ---
    if(t < countdownStart){
      // black silence — nothing visible yet
      countdownWrap.style.opacity = '0';
    } else if(t < countdownEnd){
      countdownWrap.style.opacity = '1';
      const progress = Math.min(1, (t-countdownStart)/TOTAL_COUNT_MS);
      const offset = CIRC * (1-progress);
      ring.setAttribute('stroke-dashoffset', offset.toFixed(2));

      const idx = Math.min(COUNT_START-1, Math.floor((t-countdownStart)/STEP_MS));
      const num = COUNT_START - idx;
      if(digitEl.dataset.cur != num){
        digitEl.textContent = num;
        digitEl.dataset.cur = num;
        if(audioCtx){
          click(audioCtx.currentTime, Math.random());
        }
      }
    } else if(t < resolveAt){
      // circle fully closed, digit still visible briefly, ring fully closed (offset 0)
      ring.setAttribute('stroke-dashoffset', '0');
      digitEl.textContent = '1';
      if(!clicksScheduled && audioCtx){
        clicksScheduled = true;
        breathResolve(audioCtx.currentTime + (resolveAt-t)/1000 * 0);
      }
    } else if (t < settleEnd) {
      // fade out the countdown ring/digit as image steadies
      const p = (t-resolveAt)/(settleEnd-resolveAt);
      countdownWrap.style.opacity = String(1-easeInOutCubic(Math.min(p,1)));
    } else {
      countdownWrap.style.opacity = '0';
    }

    // --- Logo text reveal: like a print resolving in a developer tray ---
    if(t >= textStart){
      const pRaw = Math.min(1, (t-textStart)/TEXT_FADE_MS);
      const pOpacity = Math.pow(pRaw, 1.7);       // imperceptible start, then blooms
      const pBlur = easeInOutCubic(pRaw);
      logoText.style.opacity = String(pOpacity);
      logoText.style.filter = `blur(${((1-pBlur)*4.5).toFixed(2)}px)`;
    }

    // --- Final hold, then fade the whole frame to black ---
    if(t >= finalFadeStart){
      const p = easeInOutCubic(Math.min(1, (t-finalFadeStart)/FINAL_FADE_MS));
      finalFade.style.opacity = String(p);
      if(!audioFadeScheduled && audioCtx && humGain){
        audioFadeScheduled = true;
        const now = audioCtx.currentTime;
        humGain.gain.cancelScheduledValues(now);
        humGain.gain.setValueAtTime(humGain.gain.value, now);
        humGain.gain.linearRampToValueAtTime(0.0, now + FINAL_FADE_MS/1000);
      }
    }

    requestAnimationFrame(frameLoop);
  }

  startBtn.addEventListener('click', function(){
    startBtn.classList.add('hidden');
    soundNote.classList.add('hidden');
    try{
      initAudio();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      // fade hum in gently, like a motor reaching speed
      const now = audioCtx.currentTime;
      humGain.gain.setValueAtTime(0.0, now);
      humGain.gain.linearRampToValueAtTime(0.5, now + PRE_SILENCE_MS/1000 + 0.3);
    }catch(e){
      console.warn('Audio unavailable, continuing silently.', e);
    }
    requestAnimationFrame(frameLoop);
  }, {once:true});

})();
</script>
</body>
</html>
